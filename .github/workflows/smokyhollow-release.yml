name: Smoky Hollow Mac release

# Builds the Mac version of Smoky Hollow (the game for Apple-chip and Intel Macs, plus the Mac launcher)
# and posts them as a GitHub release. Run it from the Actions tab: "Smoky Hollow Mac release" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release name, e.g. v0.4.3-sh4"
        required: true
        default: "v0.4.3-sh4"
      version:
        description: "Game version the town server expects (version.txt)"
        required: true
        default: "v0.4.3"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Make the Mac icon
        run: |
          set -e
          mkdir -p build/smokyhollow.iconset dist
          SRC=TSOClient/FSO.Unix/smokyhollow-1024.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "build/smokyhollow.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d "$SRC" --out "build/smokyhollow.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/smokyhollow.iconset -o build/smokyhollow.icns

      - name: Build the game (Apple chip + Intel)
        run: |
          set -e
          VERSION="${{ github.event.inputs.version }}"
          for RID in osx-arm64 osx-x64; do
            OUT="publish-$RID"
            dotnet publish TSOClient/FSO.Unix -c Release -r "$RID" --self-contained -o "$OUT"
            APP="$OUT/SmokyHollow.app"
            test -x "$APP/Contents/MacOS/SmokyHollow" || { echo "::error::$APP was not built"; exit 1; }
            printf '%s\n' "$VERSION" > "$OUT/version.txt"
            printf '%s\n' "$VERSION" > "$APP/Contents/MacOS/version.txt"
            cp build/smokyhollow.icns "$APP/Contents/Resources/smokyhollow.icns"
            # Macs refuse to run unsigned code, so give the app an ad-hoc signature.
            codesign --force --deep --timestamp=none -s - "$APP"
            codesign --verify --deep --strict "$APP"
            ( cd "$OUT" && zip -qry "../dist/SmokyHollow-client-$RID.zip" . )
          done

      - name: Build the Mac launcher
        run: |
          set -e
          for RID in osx-arm64 osx-x64; do
            dotnet publish Launcher/SmokyHollow.Launcher/SmokyHollow.Launcher.csproj -c Release -r "$RID" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "launcher-$RID"
          done
          APP="build/Smoky Hollow.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp Launcher/mac/Info.plist "$APP/Contents/Info.plist"
          tr -d '\r' < Launcher/mac/SmokyHollowLauncher > "$APP/Contents/MacOS/SmokyHollowLauncher"
          cp launcher-osx-arm64/SmokyHollowLauncher "$APP/Contents/MacOS/SmokyHollowLauncher-arm64"
          cp launcher-osx-x64/SmokyHollowLauncher "$APP/Contents/MacOS/SmokyHollowLauncher-x64"
          chmod +x "$APP/Contents/MacOS/"*
          cp build/smokyhollow.icns "$APP/Contents/Resources/smokyhollow.icns"
          codesign --force --deep --timestamp=none -s - "$APP"
          codesign --verify --deep --strict "$APP"
          ( cd build && ditto -c -k --sequesterRsrc --keepParent "Smoky Hollow.app" ../dist/SmokyHollowLauncher-mac.zip )

      - name: Fingerprints
        run: shasum -a 256 dist/*

      - name: Post the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.event.inputs.release }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Smoky Hollow for Mac ($TAG)" \
              --notes "Smoky Hollow for Mac. Most people only need SmokyHollowLauncher-mac.zip; the launcher downloads everything else."
          fi
